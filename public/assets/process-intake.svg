<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#ffffff" fill-opacity="0.02" />
    </pattern>

    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feGaussianBlur stdDeviation="12" result="blur3" />
      <feMerge>
        <feMergeNode in="blur3" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Vignette Overlay -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="40%" stop-color="#050507" stop-opacity="0" />
      <stop offset="100%" stop-color="#050507" stop-opacity="0.8" />
    </radialGradient>
  </defs>

  <style><![CDATA[
.pulse-dot {
      transform-origin: 300px 200px;
      animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.15);
      }
    }
]]></style>

  <!-- Dark Base Background -->
  <rect width="100%" height="100%" fill="#0a0a0c" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Atmospheric Particles -->
  <g fill="#ffffff">
    <circle cx="150" cy="100" r="1" fill-opacity="0.05" />
    <circle cx="480" cy="120" r="1.5" fill-opacity="0.03" />
    <circle cx="180" cy="320" r="1" fill-opacity="0.06" />
    <circle cx="430" cy="310" r="2" fill-opacity="0.02" />
    <circle cx="300" cy="50" r="1" fill="#C8F135" fill-opacity="0.15" />
  </g>

  <!-- 20-Minute Concept Background Geometry -->
  <g id="timer-concept">
    <!-- Faint full circle track -->
    <circle cx="300" cy="200" r="130" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" fill="none" />
    
    <!-- 20-minute highlighted arc (120 degrees from top) -->
    <path d="M 300 70 A 130 130 0 0 1 412.58 265" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" fill="none" stroke-linecap="round" />
    
    <!-- Timer Tick Marks -->
    <line x1="300" y1="65" x2="300" y2="75" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" stroke-linecap="round" />
    <line x1="300" y1="65" x2="300" y2="75" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" stroke-linecap="round" transform="rotate(120 300 200)" />
  </g>

  <!-- Primary Subject: Overlapping Speech Bubbles -->
  <g id="speech-bubbles" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round">
    
    <!-- Left Bubble (Form/Intake) -->
    <!-- Center: 230, 200 | Radius: 80 | Tail at 120 & 150 degrees -->
    <path d="M 310 200 
             A 80 80 0 0 1 190 269.28 
             L 120 300 
             L 160.72 240 
             A 80 80 0 1 1 310 200 Z" />
             
    <!-- Right Bubble (Voice/Conversation) -->
    <!-- Center: 370, 200 | Radius: 80 | Tail at 60 & 30 degrees (mirrored) -->
    <path d="M 290 200 
             A 80 80 0 0 0 410 269.28 
             L 480 300 
             L 439.28 240 
             A 80 80 0 1 0 290 200 Z" />
  </g>

  <!-- Inner Abstract Details -->
  <g stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" stroke-linecap="round" fill="none">
    <!-- Left Bubble: Structured Intake Lines -->
    <path d="M 190 175 h 50 
             M 190 195 h 70 
             M 190 215 h 40" />
             
    <!-- Right Bubble: Organic Voice Wave -->
    <path d="M 340 195 v 10 
             M 350 185 v 30 
             M 360 175 v 50 
             M 370 165 v 70 
             M 380 175 v 50 
             M 390 185 v 30 
             M 400 195 v 10" />
  </g>

  <!-- Center Intersection: Pulsing Neon Node -->
  <g id="center-node">
    <!-- Subtle background glow to anchor the dot -->
    <circle cx="300" cy="200" r="12" fill="#C8F135" fill-opacity="0.05" />
    
    <!-- The animated neon dot -->
    <circle cx="300" cy="200" r="6" fill="#C8F135" filter="url(#neon-glow)" class="pulse-dot" />
  </g>

  <!-- Foreground Vignette Overlay -->
  <rect width="100%" height="100%" fill="url(#vignette)" pointer-events="none" />
</svg>