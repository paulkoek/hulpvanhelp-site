<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style><![CDATA[
@keyframes slow-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .rotating-ring {
        transform-origin: 200px 200px;
        animation: slow-spin 8s linear infinite;
      }
]]></style>
  </defs>

  <!-- Transparent dark background -->
  <rect width="100%" height="100%" fill="#050507" fill-opacity="0.6" />

  <!-- Radiating horizontal scan lines -->
  <g stroke="#ffffff" stroke-linecap="round" opacity="0.08">
    <line x1="285" y1="188" x2="315" y2="188" stroke-width="1" />
    <line x1="292" y1="200" x2="340" y2="200" stroke-width="1.5" />
    <line x1="285" y1="212" x2="322" y2="212" stroke-width="1" />
  </g>

  <!-- Rotating outer ring (Magnifying glass concept) -->
  <g class="rotating-ring">
    <!-- Main magnifying glass circle -->
    <circle cx="200" cy="200" r="70" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.12" />
    
    <!-- Magnifying glass handle -->
    <line x1="249.5" y1="249.5" x2="278" y2="278" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.12" />
    
    <!-- Geometric tracking details to emphasize rotation -->
    <circle cx="200" cy="200" r="64" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="2 6" opacity="0.06" />
    <path d="M 200 126 L 200 132 M 200 268 L 200 274 M 126 200 L 132 200 M 268 200 L 274 200" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.12" />
  </g>

  <!-- Center neon green dot with glow -->
  <circle cx="200" cy="200" r="3" fill="#C8F135" filter="url(#neon-glow)" />
  <circle cx="200" cy="200" r="1.5" fill="#ffffff" opacity="0.8" />
</svg>